[package]
name = "shvessel-esp32s3-mini-exec"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-hal = { version = "1.1.1", features = ["esp32s3"] }
esp-println = { version = "0.17.0", features = ["esp32s3"] }
shvessel = { path = "../..", features = ["mini_exec"] }
