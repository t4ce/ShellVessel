[package]
name = "shvessel"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "no_std command registry and job vessel primitives for platform shells"
homepage = "https://github.com/t4ce/ShellVessel"
repository = "https://github.com/t4ce/ShellVessel"
readme = "README"
keywords = ["shell", "commands", "no-std", "embedded", "platform"]
categories = ["no-std", "embedded", "command-line-utilities"]

[features]
default = []
mini_exec = []

[lib]
path = "src/lib.rs"

[[example]]
name = "mini_exec_proof"
path = "demos_tests/executor_test/mini_exec_test.rs"
required-features = ["mini_exec"]

[[test]]
name = "mini_exec_test"
path = "demos_tests/executor_demo/mini_exec.rs"
required-features = ["mini_exec"]
